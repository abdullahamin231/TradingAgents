services:
  webui:
    build: .
    container_name: tradingagents-webui
    user: root
    entrypoint: []
    command: ["uvicorn", "webui.app:app", "--host", "0.0.0.0", "--port", "2026"]
    env_file:
      - .env
    environment:
      OPENCODE_COMMAND: /opt/opencode/bin/opencode run
      XDG_CONFIG_HOME: /opt/opencode-config
      XDG_STATE_HOME: /home/appuser/app/.tradingagents/opencode-state
      XDG_DATA_HOME: /home/appuser/app/.tradingagents/opencode-data
      XDG_CACHE_HOME: /home/appuser/app/.tradingagents/opencode-cache
      SEEKING_ALPHA_COOKIES_PATH: /home/appuser/app/seeking_alpha_cookies.json
    volumes:
      - /root/TradingAgents:/home/appuser/app
      - /root/TradingAgents/seeking_alpha_cookies.json:/home/appuser/app/seeking_alpha_cookies.json
      - /root/TradingAgents/webui_artifacts:/home/appuser/app/webui_artifacts
      - /root/TradingAgents/reports:/home/appuser/app/reports
      - /root/TradingAgents/.tradingagents:/home/appuser/app/.tradingagents
      - /root/.opencode:/opt/opencode:ro
      - /root/.config/opencode:/opt/opencode-config/opencode:ro
      - /root/.local/share/opencode/auth.json:/home/appuser/app/.tradingagents/opencode-data/opencode/auth.json:ro
    ports:
      - "2026:2026"
    restart: unless-stopped

  webui-watchtower:
    image: docker:27-cli
    container_name: tradingagents-webui-watchtower
    working_dir: /workspace
    environment:
      WATCH_BRANCH: main
      WATCH_INTERVAL_SECONDS: 900 # 15 minutes
      WEBUI_SERVICE: webui
      WEBUI_CONTAINER: tradingagents-webui
      GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known_hosts
    volumes:
      - /root/TradingAgents:/workspace
      - /root/.ssh:/root/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache git openssh-client
        git config --global --add safe.directory /workspace

        while true; do
          current_branch="$$(git rev-parse --abbrev-ref HEAD 2>/dev/null || true)"

          if [ "$$current_branch" = "$$WATCH_BRANCH" ]; then
            if git fetch origin "$$WATCH_BRANCH"; then
              local_commit="$$(git rev-parse HEAD)"
              remote_commit="$$(git rev-parse "origin/$$WATCH_BRANCH")"

              if [ "$$local_commit" != "$$remote_commit" ]; then
                # Recreate the service so updated code, dependencies, and compose
                # settings all take effect; fall back to a restart if compose is unavailable.
                if git pull --ff-only origin "$$WATCH_BRANCH"; then
                  docker compose up -d --build --force-recreate --no-deps "$$WEBUI_SERVICE" || docker restart "$$WEBUI_CONTAINER"
                fi
              fi
            else
              echo "Skipping update: git fetch failed for origin/$$WATCH_BRANCH"
            fi
          else
            echo "Skipping update: checked out branch is $$current_branch, expected $$WATCH_BRANCH"
          fi

          sleep "$$WATCH_INTERVAL_SECONDS"
        done
    depends_on:
      - webui
    restart: unless-stopped

  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - tradingagents_data:/root/trading-agents/TradingAgents/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    profiles:
      - ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
      - TRADINGAGENTS_BACKEND_URL=http://ollama:11434/v1
    volumes:
      - tradingagents_data:/root/trading-agents/TradingAgents/.tradingagents
    depends_on:
      ollama:
        condition: service_healthy
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
